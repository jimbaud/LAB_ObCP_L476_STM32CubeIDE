<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<title>Bannière ObCP OTA BLE</title>
<link rel="stylesheet" href="theme.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "clair";</script>
<style>
  .figure {
    width: 960px; height: 300px;
    background:
      radial-gradient(520px 300px at 76% 62%, var(--lueur-1), transparent 70%),
      radial-gradient(360px 240px at 93% 18%, var(--lueur-2), transparent 70%),
      linear-gradient(115deg, var(--fond-doux) 0%, var(--fond) 58%);
  }
  [data-theme="clair"]  .figure { --lueur-1: rgba(9, 105, 218, .10);  --lueur-2: rgba(130, 80, 223, .10); }
  [data-theme="sombre"] .figure { --lueur-1: rgba(68, 147, 248, .17); --lueur-2: rgba(171, 125, 248, .16);
                                   background-color: var(--fond); }
  .texte { position: absolute; left: 46px; top: 50%; transform: translateY(-52%); width: 405px; }
  .surtitre { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--discret); }
  h1 { font-family: "Inter Display", "Inter", sans-serif; font-size: 56px; font-weight: 800;
       letter-spacing: -.025em; line-height: 1.02; margin: 10px 0 14px; }
  h1 .ble { background: linear-gradient(90deg, var(--bleu), var(--violet));
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  .accroche { font-size: 17.5px; line-height: 1.45; color: var(--texte); opacity: .86; }
  .pastilles { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .pastilles .pastille { font-size: 12.5px; padding: 4px 11px; background: var(--fond); }
  .pastilles .pastille.vert, .pastilles .pastille.bleu { background: var(--c-fond); }
  .carte { position: absolute; right: 24px; bottom: 12px; width: 480px; }
  .ondes { position: absolute; right: 0; top: 0; width: 960px; height: 300px; overflow: visible; }
  .ondes path { fill: none; stroke: var(--violet); stroke-width: 3; stroke-linecap: round; }
</style>
</head>
<body>
<div id="figure" class="figure">
  <img class="carte" src="ressources/carte_iso.png" alt="">
  <svg class="ondes" viewBox="0 0 960 300">
    <g transform="translate(902 128) rotate(-42)">
      <path d="M 0 -15 A 15 15 0 0 1 0 15" style="opacity:.95"/>
      <path d="M 9 -27 A 29 29 0 0 1 9 27" style="opacity:.6"/>
      <path d="M 18 -39 A 43 43 0 0 1 18 39" style="opacity:.32"/>
    </g>
  </svg>
  <div class="texte">
    <div class="surtitre">LAB ObCP · STM32L476RG · BlueNRG-M0</div>
    <h1>ObCP OTA <span class="ble">BLE</span></h1>
    <p class="accroche">Chargez vos programmes par Bluetooth, en un clic depuis
      STM32CubeIDE, sans câble ni interrupteur.</p>
    <div class="pastilles">
      <span class="pastille bleu">application PC 1.2</span>
      <span class="pastille vert">chargeur 1.1</span>
      <span class="pastille">Python + Bleak</span>
    </div>
  </div>
</div>
<script src="outils.js"></script>
<script>quand_pret(() => {});</script>
</body>
</html>
